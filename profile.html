<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>izziloan — Application Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#1e3a5f;--accent:#d4a017;--bg:#f3f4f6;--card:#fff;--border:#e5e7eb;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:#111827;padding:1.5rem}
  .wrap{max-width:720px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
  h1{font-size:1.5rem;font-weight:700}
  .card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.5rem;margin-bottom:1rem}
  .row{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--border);font-size:.9rem;gap:1rem}
  .row:last-child{border-bottom:none}
  .label{color:var(--muted);font-weight:500;flex-shrink:0}
  .value{font-weight:600;text-align:right;word-break:break-word}
  .status{padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600}
  .status.pending{background:#fef3c7;color:#92400e}
  .status.approved{background:#d1fae5;color:#065f46}
  .status.declined{background:#fee2e2;color:#991b1b}
  .empty{text-align:center;padding:3rem;color:var(--muted)}
  .back{display:inline-block;margin-bottom:1rem;color:var(--primary);font-weight:600;text-decoration:none}
  .note{background:#fef9c3;border:1px solid #fde047;border-radius:.5rem;padding:.75rem;margin-bottom:1rem;font-size:.8rem;color:#713f12}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to Home</a>
  <div class="top">
    <h1>Application Profile</h1>
  </div>
  <div class="note">Client-side view (GitHub Pages). Reads from this browser's localStorage.</div>
  <div id="content" class="empty">Loading…</div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const appId = params.get('app_id') || params.get('application_id');
  const apps = JSON.parse(localStorage.getItem('izziloan_applications') || '[]');
  const app = apps.find(a => String(a.id) === String(appId) || String(a.application_number) === String(appId));

  const content = document.getElementById('content');
  if (!app) {
    content.innerHTML = '<div class="empty">Application not found in this browser.</div>';
  } else {
    const skip = new Set(['bank_statements','bank_statement_1','bank_statement_2','bank_statement_3','payslip_1','payslip_2','payslip_3','id_front','id_back']);
    content.innerHTML = '<div class="card">' +
      Object.keys(app).filter(k=>!skip.has(k)).map(k => {
        let v = app[k];
        if (v === null || v === undefined) v = '—';
        if (typeof v === 'object') v = JSON.stringify(v);
        if (k === 'status') v = '<span class="status ' + String(v).toLowerCase().replace(' ','_') + '">' + v + '</span>';
        return '<div class="row"><span class="label">' + k.replace(/_/g,' ') + '</span><span class="value">' + v + '</span></div>';
      }).join('') + '</div>';
  }
</script>
</body>
</html>
