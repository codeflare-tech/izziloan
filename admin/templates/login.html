<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — izziloan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: 220 65% 33%;
    --primary-light: 220 55% 45%;
    --accent: 45 62% 53%;
    --bg: 220 20% 96%;
    --fg: 220 65% 15%;
    --border: 220 20% 88%;
    --radius: 0.75rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: hsl(var(--bg));
    color: hsl(var(--fg));
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
  }
  .login-card {
    width: 100%;
    max-width: 24rem;
    background: #fff;
    border: 1px solid hsl(var(--border));
    border-radius: 1rem;
    padding: 2.5rem 2rem;
    box-shadow: 0 10px 40px -12px hsl(220 65% 33% / .18);
  }
  .login-brand {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: 2rem;
  }
  .login-brand-mark {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: .6rem;
    background: linear-gradient(135deg, hsl(45 62% 53%), hsl(45 62% 65%));
    display: grid;
    place-items: center;
    font-weight: 800;
    color: hsl(220 75% 25%);
    font-size: 1rem;
  }
  .login-brand span {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -.02em;
  }
  .login-card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: .25rem;
  }
  .login-card p {
    font-size: .9375rem;
    color: hsl(var(--muted, 220 20% 45%));
    margin-bottom: 2rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: .875rem;
    font-weight: 600;
    margin-bottom: .375rem;
  }
  input {
    width: 100%;
    padding: .625rem .875rem;
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    transition: all .2s;
  }
  input:focus {
    outline: none;
    border-color: hsl(var(--primary));
    box-shadow: 0 0 0 3px hsl(var(--primary) / .12);
  }
  .btn {
    width: 100%;
    padding: .75rem;
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-light)));
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    margin-top: .5rem;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px -8px hsl(var(--primary) / .35);
  }
  .btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
  }
  .error {
    background: hsl(0 84% 60% / .08);
    border: 1px solid hsl(0 84% 60% / .25);
    color: hsl(0 84% 40%);
    padding: .75rem 1rem;
    border-radius: var(--radius);
    font-size: .875rem;
    margin-bottom: 1rem;
    display: none;
  }
  .error.visible {
    display: block;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    color: hsl(var(--primary));
    font-weight: 600;
    font-size: .9375rem;
    text-decoration: none;
    margin-bottom: 1.5rem;
  }
  .back-link:hover {
    color: hsl(var(--primary-light));
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">i</div>
      <span>izziloan</span>
    </div>
    <h1>Admin Login</h1>
    <p>Sign in to access the admin dashboard</p>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@izziloan.co.za">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('visible');
    
    const payload = {
      username: form.email.value.trim(),
      password: form.password.value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams(payload)
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || 'Login failed');
      }

      window.location.href = '/admin/';
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>

</body>
</html>
